[workspace]
authors = ["Adam D. Hines <adam.hines@qut.edu.au>, Gokul B. Nair, Nicolas Guillermo Marticorena Vidal, Michael Milford, Tobias Fischer"]
channels = ["conda-forge", "adamhines"]
name = "EventGeM"
platforms = [
    { platform = "linux-64", cuda = "12", glibc = "2.35" },
    { platform = "linux-aarch64", cuda = "12", glibc = "2.35" },
]
version = "1.0.0"

[tasks]
eventgem = {cmd = "python3 main.py"}

inference-jetson = {cmd = "python3 eventgem/inference-jetson.py"}

# Paper specific comparisons. These use the default in-repo data directories; override by
# appending e.g. `--data-root /path/to/datasets` to the `pixi run` invocation.
sunset2-sunset1 = {cmd = "python3 main.py -d brisbane_event -r sunset2 -q sunset1 --ref-offset 1587540271650 --query-offset 1587452582350"}
sunset2-morning = {cmd = "python3 main.py -d brisbane_event -r sunset2 -q morning --ref-offset 1587540271650 --query-offset 1588029265730"}
sunset2-daytime = {cmd = "python3 main.py -d brisbane_event -r sunset2 -q daytime --ref-offset 1587540271650 --query-offset 1587705130800"}
sunset2-sunrise = {cmd = "python3 main.py -d brisbane_event -r sunset2 -q sunrise --ref-offset 1587540271650 --query-offset 1588105232910"}
sunset2-night = {cmd = "python3 main.py -d brisbane_event -r sunset2 -q night --ref-offset 1587540271650 --query-offset 1587975221100"}

R0FA0-R0FS0 = {cmd = "python3 main.py -d nsavp -r R0_FA0 -q R0_FS0"}
R0FA0-R1DA0 = {cmd = "python3 main.py -d nsavp -r R0_FA0 -q R1_DA0"}
R0FA0-R1FA0 = {cmd = "python3 main.py -d nsavp -r R0_FA0 -q R1_FA0"}

